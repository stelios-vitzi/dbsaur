name: Desktop build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release signing setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Check signing configuration before starting native builds
        env:
          RELEASE_SIGNED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/desktop-release.mjs preflight

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            bundles: nsis,msi
            target: ''
          - platform: linux-x64
            runner: ubuntu-22.04
            bundles: deb,rpm,appimage
            target: ''
          - platform: macos-universal
            runner: macos-15
            bundles: app,dmg
            target: universal-apple-darwin
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/dist
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_BUNDLES: ${{ matrix.bundles }}
      RELEASE_SIGNED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: bash scripts/install-linux-deps.sh
      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      - name: Install both macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Cache Rust dependencies and Tauri CLI
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: desktop-${{ matrix.platform }}-tauri-2.12.4
          workspaces: src-tauri -> ../dist
          cache-on-failure: 'true'
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Install Tauri CLI on cache miss
        run: |
          if [[ "$(cargo tauri --version 2>/dev/null || true)" != 'tauri-cli 2.12.4' ]]; then
            cargo install tauri-cli --locked --version 2.12.4 --force
          fi
      - run: npm --prefix frontend ci
      - run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path xtask/Cargo.toml --locked
      - run: node --test scripts/desktop-release.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Select installer version
        id: version
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/desktop-release.mjs version
      - name: Build native packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--ci --bundles "$RELEASE_BUNDLES" --config .artifacts/desktop-release.json)
          if [[ -n "$RELEASE_TARGET" ]]; then args+=(--target "$RELEASE_TARGET"); fi
          cargo xtask build "${args[@]}" -- --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Collect release assets and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/desktop-release.mjs collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbsaur-${{ matrix.platform }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 14

  audit-npm:
    name: Block high/critical npm vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm --prefix frontend audit --offline=false --audit-level=high

  audit-rust:
    name: Block Rust vulnerabilities (${{ matrix.lockfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lockfile: [backend/Cargo.lock, src-tauri/Cargo.lock, xtask/Cargo.lock]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust audit tool
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-audit-0.23.0
          workspaces: xtask
          cache-targets: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - name: Install cargo-audit on cache miss
        shell: bash
        run: |
          if [[ "$(cargo audit --version 2>/dev/null || true)" != *' 0.23.0' ]]; then
            cargo install cargo-audit --locked --version 0.23.0 --force
          fi
      # RustSec advisories without a CVSS score must also block publication.
      - run: cargo audit --file "${{ matrix.lockfile }}"

  release:
    needs: [preflight, build, audit-npm, audit-rust]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dbsaur-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TAG="$tag" node scripts/desktop-release.mjs manifest
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "DBsaur ${RELEASE_VERSION}" --generate-notes --draft
          gh release edit "$tag" --draft=false --latest

  summary:
    name: Release outcome
    needs: [preflight, build, audit-npm, audit-rust, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report publication and blocking gates
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NPM_RESULT: ${{ needs.audit-npm.result }}
          RUST_RESULT: ${{ needs.audit-rust.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          PUBLISH_EXPECTED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          {
            echo '## Desktop release outcome'
            echo "Signing setup: $PREFLIGHT_RESULT"
            echo "Native builds: $BUILD_RESULT"
            echo "npm audit: $NPM_RESULT"
            echo "RustSec audits (all three lockfiles): $RUST_RESULT"
            echo "Publication: $RELEASE_RESULT"
            if [[ "$RELEASE_RESULT" == success ]]; then
              echo "[Published releases](https://github.com/$GITHUB_REPOSITORY/releases)"
            elif [[ "$PUBLISH_EXPECTED" == true && "$PREFLIGHT_RESULT" != success ]]; then
              echo 'No release was published: signing setup did not pass. See Validate release signing setup and docs/desktop-updates.md.'
            elif [[ "$PUBLISH_EXPECTED" == true ]]; then
              echo 'No release was published. Review the failed or cancelled gates above.'
            else
              echo 'Publication is only enabled for main pushes and manual runs on main.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH_EXPECTED" == true && "$RELEASE_RESULT" != success ]]; then
            exit 1
          fi
