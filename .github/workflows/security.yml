name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: '21 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm --prefix frontend audit --offline=false --audit-level=high
  rust:
    strategy:
      fail-fast: false
      matrix:
        lockfile: [backend/Cargo.lock, src-tauri/Cargo.lock, xtask/Cargo.lock]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked --version 0.23.0
      - run: cargo audit --file "${{ matrix.lockfile }}"
