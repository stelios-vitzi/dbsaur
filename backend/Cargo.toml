[package]
name = "dbsaur"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "DBsaur, a local database workspace for PostgreSQL, MySQL, MariaDB, SQL Server, and SQLite"
repository = "https://github.com/SteliosDaVitzi/web-db-tool"
publish = false

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json"] }
sqlx-postgres = { version = "=0.9.0", default-features = false, features = ["json"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["json"] }
rusqlite = { version = "0.42.0", features = ["bundled", "column_decltype", "hooks", "limits"] }
aes-gcm = "0.11.1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
mongodb = { version = "3.10", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }

tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "rustls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlparser = { version = "0.64", features = ["visitor"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
